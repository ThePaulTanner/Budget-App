name: Server CI

on:
  pull_request:
    paths:
      - "server/**"
      - "api-fixtures/**"
      - ".github/workflows/server-*.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "api-fixtures/**"
      - ".github/workflows/server-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - name: Tests
        working-directory: server
        run: python -m pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image (the Synology DS423+ is Intel)
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: homefinance:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test with the same hardening as docker-compose.yml
        run: |
          set -euo pipefail
          KEY=$(docker run --rm homefinance:ci python -m app.cli gen-key)
          docker run -d --name hf \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v hfdata:/data -e HF_MASTER_KEY="$KEY" \
            -p 127.0.0.1:8080:8080 homefinance:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/summary)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs)" = 404
          test "$(docker exec hf id -u)" != 0   # never root
          docker exec hf python -m app.cli --help >/dev/null
          docker logs hf
          docker rm -f hf
