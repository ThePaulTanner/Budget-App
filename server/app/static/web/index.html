<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <title>HomeFinance</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/web/app.css">
  <script src="/static/web/theme.js"></script>
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="7" fill="currentColor"/><path d="M5.5 16l4.2-4.4 3 3L18.5 8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
      <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9l1.6-5h14.8L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/><path d="M6 15h4"/></symbol>
      <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 4v6h-6"/><path d="M20 15a8 8 0 11-2-8.4L21 10"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
    </defs>
  </svg>

  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <svg class="logo" width="44" height="44" aria-hidden="true"><use href="#i-logo"/></svg>
      <h1>HomeFinance</h1>
      <p class="muted">Sign in to your private finance dashboard.</p>
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <label>Authenticator code or recovery code
        <input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
      <button type="submit" class="primary wide">Sign in</button>
      <p id="login-message" class="error" role="alert"></p>
    </form>
  </section>

  <div id="shell" class="app" hidden>
    <aside class="sidebar">
      <div class="brand-row">
        <a class="brand" href="#/overview" aria-label="HomeFinance, go to Overview">
          <svg class="logo" width="30" height="30" aria-hidden="true"><use href="#i-logo"/></svg><span>HomeFinance</span>
        </a>
        <button type="button" class="icon-btn refresh-btn brand-refresh" title="Reload this page's data (does not sync banks)" aria-label="Reload this page's data"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-refresh"/></svg></button>
      </div>
      <nav id="tabs" aria-label="Sections">
        <a href="#/overview" data-tab="overview"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-home"/></svg><span>Overview</span></a>
        <a href="#/transactions" data-tab="transactions"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-list"/></svg><span class="lbl">Transactions</span><span class="lbl-short" aria-hidden="true">Activity</span></a>
        <a href="#/merchants" data-tab="merchants"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-store"/></svg><span>Merchants</span></a>
        <a href="#/budgets" data-tab="budgets"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-target"/></svg><span>Budgets</span></a>
        <a href="#/money" data-tab="money"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-card"/></svg><span class="lbl">Money Management</span><span class="lbl-short" aria-hidden="true">Money</span></a>
        <a href="#/investments" data-tab="investments"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-trend"/></svg><span class="lbl">Investments</span><span class="lbl-short" aria-hidden="true">Invest</span></a>
      </nav>
      <div class="side-foot">
        <span id="env-badge" class="env" hidden></span>
        <button id="signout" type="button" class="ghost"><svg class="ico" width="18" height="18" aria-hidden="true"><use href="#i-logout"/></svg><span>Sign out</span></button>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div class="titles">
          <h1 id="page-title">Overview</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="top-actions">
          <label id="viewer-wrap" class="viewer" hidden><span class="sr">Whose money</span><select id="viewer" aria-label="Whose money to show"></select></label>
          <button type="button" class="icon-btn refresh-btn phone-only" title="Reload this page's data (does not sync banks)" aria-label="Reload this page's data"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-refresh"/></svg></button>
          <a id="settings-link" href="#/settings" data-tab="settings" class="icon-btn" title="Settings" aria-label="Settings"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-gear"/></svg></a>
        </div>
      </header>
      <p id="banner" class="banner" hidden></p>
      <p id="alert" class="banner danger" hidden></p>
      <main id="view" aria-live="polite"></main>
      <footer class="footer">
        <span>HomeFinance &middot; your data stays on your own server</span>
        <span id="foot-sync" class="muted"></span>
      </footer>
    </div>
  </div>

  <dialog id="sheet"></dialog>
  <dialog id="confirm" aria-labelledby="confirm-title"></dialog>
  <p id="toast" role="status" aria-live="polite" hidden></p>
  <div id="cover" class="cover" hidden>HomeFinance</div>
  <script src="/static/web/app.js"></script>
</body>
</html>
